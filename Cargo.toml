[package]
name = "uar"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
authors = ["Outscale IAM Service Unit"]
homepage = "https://git.scaledome.io/iam/uar"
readme = "README.md"
repository = "https://git.scaledome.io/iam/uar"
publish = false #We don't publish in public crates.io
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
itertools = "0.15.0"
outscale_api = "1.22.0"
phf = { version = "0.14.0", features = ["macros"] }
regex = "1.10.6"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
